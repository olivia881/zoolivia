# APK debug di PrismaScanner (cartella magazzino-scanner).
# GitHub → Azioni → «Build PrismaScanner APK» → «Esegui workflow» (scegli il branch).

name: Build PrismaScanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "magazzino-scanner/**"
      - ".github/workflows/build-prisma-scanner-apk.yml"
  pull_request:
    paths:
      - "magazzino-scanner/**"
      - ".github/workflows/build-prisma-scanner-apk.yml"

permissions:
  contents: read

concurrency:
  group: prisma-scanner-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Compila APK debug (PrismaScanner)
        working-directory: magazzino-scanner
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Prepara file per download
        run: |
          cp magazzino-scanner/app/build/outputs/apk/debug/app-debug.apk prisma-scanner-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: prisma-scanner-apk-debug
          path: prisma-scanner-debug.apk
