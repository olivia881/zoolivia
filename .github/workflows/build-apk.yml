name: Build APK

# APK: dopo un run verde → Release «Ultimo APK» oppure tab Artifacts.
# Dal branch di sviluppo: Azioni → Build APK → «Run workflow» → scegli il branch.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Dipendenze web e sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Compila APK debug
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rinomina APK per il download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk turni-servizio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: turni-servizio-apk
          path: turni-servizio.apk

      # Stesso tag = stesso URL di release; eliminiamo tag/release vecchi e li ricreiamo su questo commit.
      - name: Rimuovi release/tag apk-ultimo precedenti
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-ultimo --yes 2>/dev/null || true
          gh api --method DELETE "repos/${{ github.repository }}/git/refs/tags/apk-ultimo" 2>/dev/null || true

      - name: Pubblica release "Ultimo APK"
        uses: ncipollo/release-action@v1
        with:
          tag: apk-ultimo
          name: Ultimo APK — Turni di servizio
          body: |
            APK debug generato automaticamente da GitHub Actions (commit `${{ github.sha }}`, branch `${{ github.ref_name }}`).

            **Installazione:** scarica **turni-servizio.apk**, aprilo sul telefono e consenti l’installazione da origini sconosciute se richiesto.

            Per aggiornare: torna su questa pagina dopo un nuovo build verde in **Actions** e scarica di nuovo l’APK.
          artifacts: turni-servizio.apk
          token: ${{ secrets.GITHUB_TOKEN }}
