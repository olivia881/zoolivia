name: Deploy GitHub Pages

# Pubblica i file statici sul branch gh-pages (metodo classico).
# In Impostazioni → Pages scegli: origine "Deploy from a branch",
# branch gh-pages, cartella / (root).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build:pages
        env:
          VITE_GITHUB_PAGES: "1"

      - name: Push su branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
