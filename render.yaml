# Deploy su Render - URL permanente per app installabile
# https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: busta-badante
    runtime: node
    plan: free
    region: frankfurt

    buildCommand: |
      npm install
      npm install --prefix backend
      npm install --prefix frontend
      npm run build

    startCommand: npm run start --prefix backend

    envVars:
      - key: NODE_ENV
        value: production
